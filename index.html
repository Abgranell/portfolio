<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arnau Boix Granell - Portfolio</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #38bdf8; --muted: #94a3b8; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; }
        .welcome-card { background: var(--card); padding: 3rem 2rem; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); max-width: 400px; width: 90%; }
        
        /* Estil per a la foto de perfil rodona */
        .profile-img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent); margin-bottom: 1.5rem; }
        
        h1 { color: var(--accent); margin-top: 0; font-size: 1.8rem; }
        p { color: var(--muted); margin-bottom: 2rem; }
        .btn-container { display: flex; flex-direction: column; gap: 1rem; }
        .btn { display: block; background: #334155; color: var(--text); padding: 0.8rem; border-radius: 8px; text-decoration: none; font-weight: bold; transition: background 0.2s; }
        .btn:hover { background: #475569; }
        .btn-primary { background: var(--accent); color: #0f172a; }
        .btn-primary:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="welcome-card">
        <!-- La teva foto de perfil a l'arrel -->
        <img src="imatges/ArnauBoix.jpeg" alt="Arnau Boix Granell" class="profile-img">
        
        <h1>Arnau Boix Granell</h1>
        <p>Selecciona el teu idioma / Select your language</p>
        
        <div class="btn-container">
            <a href="cat/index.html" class="btn btn-primary">Català (CAT)</a>
            <a href="eng/index.html" class="btn">English (ENG)</a>
        </div>
    </div>
</body>
</html>
