<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arnau Boix Granell - Portfolio</title>
    <!-- Enllaç al full d'estils general -->
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* FORCEM EL CENTRATGE EXCLUSIVAMENT EN AQUESTA PÀGINA */
        html, body {
            height: 100%;
            margin: 0;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0;
        }

        .welcome-card { background: var(--card); padding: 3rem 2rem; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.08); max-width: 400px; width: 90%; }
        
        /* Estil per a la foto de perfil rodona */
        .profile-img { width: 180px; height: 180px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent); margin-bottom: 1.5rem; }
        
        h1 { color: var(--text); margin-top: 0; font-size: 1.8rem; }
        p { color: var(--muted); margin-bottom: 2rem; }
        .btn-container { display: flex; flex-direction: column; gap: 1rem; }
        
        /* Botons utilitzant exclusivament variables globals */
        .btn { display: block; background: var(--btn-bg); color: var(--text); padding: 0.8rem; border-radius: 8px; text-decoration: none; font-weight: bold; border: 1px solid var(--border); transition: background 0.2s; }
        .btn:hover { background: var(--hover-bg); }
    </style>
</head>
<body>
    <div class="welcome-card">
        <!-- La teva foto de perfil a l'arrel -->
        <img src="imatges/ArnauBoix.jpeg" alt="Arnau Boix Granell" class="profile-img">
        
        <h1>Arnau Boix Granell</h1>
        <p>Selecciona el teu idioma / Select your language</p>
        
        <div class="btn-container">
            <a href="cat/main-cat.html" class="btn">Català</a>
            <a href="eng/main-eng.html" class="btn">English</a>
        </div>
    </div>
</body>
</html>
