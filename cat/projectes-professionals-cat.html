    <!-- Enllaç al full d'estils general -->
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        /* Estils estructurals exclusius d'aquesta pàgina */
        body { 
            display: block; 
            text-align: left; 
            position: relative; 
            padding-top: 4rem; 
            padding-bottom: 3rem;
        }

        /* Botó de LinkedIn a dalt a l'esquerra */
        .linkedin-top {
            position: absolute;
            top: 1.5rem;
            left: 2rem;
        }
        .linkedin-btn {
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .linkedin-btn:hover {
            opacity: 0.7;
        }
        .linkedin-btn svg {
            width: 35px;
            height: 35px;
            fill: #0a66c2;
        }
        
        /* Selector d'idioma a dalt a la dreta */
        .lang-selector {
            position: absolute;
            top: 1.5rem;
            right: 2rem;
        }
        .lang-btn {
            background: var(--card);
            color: var(--text);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85rem;
            border: 1px solid var(--border);
            transition: background 0.2s;
        }
        .lang-btn:hover {
            background: var(--hover-bg);
        }

        .container { max-width: 800px; margin: 0 auto; text-align: center; }
        header { margin-bottom: 3rem; }
        
        header h1 { font-size: 2.5rem; margin-bottom: 0.5rem; color: var(--text); }
        header p { color: var(--muted); font-size: 1.1rem; max-width: 600px; margin: 0 auto 1.5rem auto; }
        
        .btn-back { 
            display: inline-block; 
            background: var(--card); 
            color: var(--text); 
            padding: 0.6rem 1.2rem; 
            border-radius: 8px; 
            text-decoration: none; 
            font-weight: bold; 
            border: 1px solid var(--border); 
            margin-bottom: 2rem;
            transition: background 0.2s; 
        }
        .btn-back:hover { background: var(--hover-bg); }

        /* Targetes d'articles */
        .article-card { 
            background: var(--card); 
            border-radius: 12px; 
            padding: 2rem; 
            margin-bottom: 2rem; 
            text-align: left; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); 
            border: 1px solid var(--border); 
        }
        
        .article-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
            margin-bottom: 0.3rem;
        }

        .article-card h2 { 
            margin-top: 0; 
            margin-bottom: 0.2rem;
            color: var(--accent); 
            font-size: 1.3rem;
        }

        .article-badge {
            background: var(--hover-bg);
            color: var(--text);
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            white-space: nowrap;
            border: 1px solid var(--border);
        }

        .article-authors {
            color: var(--muted);
            font-size: 0.9rem;
            font-style: italic;
            margin-bottom: 1.2rem;
        }

        /* Multimèdia a amplada completa (Full Width) */
        .article-media-full {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            background: transparent;
            margin-bottom: 1.2rem;
            display: flex;
            justify-content: center; /* Centra horitzontalment */
            align-items: center;     /* Centra verticalment si cal */
            padding: 1rem 0;         /* Un petit respir superior i inferior */
        }

        .article-img-full {
            max-height: 100%;       /* Alçada màxima controlada */
            width: auto;             /* Amplada adaptativa proporcional */
            max-width: 100%;         /* Evita desbordaments */
            object-fit: contain;     /* Mostra tota la imatge sencera sense retallar */
            display: block;
            background: transparent; /* Assegura transparència en la imatge */
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* Proporció 16:9 */
            height: 0;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Secció de Topics */
        .article-topics {
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .topic-tag {
            display: inline-block;
            background: var(--hover-bg);
            color: var(--text);
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-right: 0.4rem;
            margin-bottom: 0.3rem;
            border: 1px solid var(--border);
        }

        .article-details p {
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 1.2rem;
            text-align: justify;     /* Aquesta línia justifica tot el text del paràgraf */
            hyphens: auto;           /* Opcional: ajuda a partir les paraules correctament en català */
        }

        .btn-article {
            display: inline-block;
            background: var(--accent);
            color: #ffffff;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        .btn-article:hover {
            opacity: 0.9;
        }
    </style>
</head>
