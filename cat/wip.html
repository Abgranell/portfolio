<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treball en progrés - Arnau Boix</title>
    <!-- Enllaç al full d'estils general (ajusta la ruta ../ si estàs dins d'una carpeta) -->
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            text-align: center; 
        }
        
        .wip-card { 
            background: var(--card); 
            padding: 3rem 2rem; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.08); 
            max-width: 450px; 
            width: 90%; 
            border: 1px solid var(--border);
        }
        
        /* Imatge/GIF WIP */
        .wip-img { 
            max-width: 180px; 
            height: auto; 
            margin-bottom: 1.5rem; 
            border-radius: 8px;
        }
        
        h1 { 
            color: var(--text); 
            margin-top: 0; 
            font-size: 2rem; 
            margin-bottom: 1rem;
        }
        
        p { 
            color: var(--muted); 
            font-size: 1.1rem; 
            margin-bottom: 2rem; 
            line-height: 1.5;
        }
        
        .btn-back { 
            display: inline-block; 
            background: var(--accent); 
            color: #ffffff; 
            padding: 0.75rem 1.5rem; 
            border-radius: 8px; 
            text-decoration: none; 
            font-weight: bold; 
            transition: opacity 0.2s; 
        }
        .btn-back:hover { 
            opacity: 0.9; 
            background: #0369a1; 
        }
    </style>
</head>
<body>
    <div class="wip-card">
        <!-- GIF animat de la carpeta giff/ -->
        
        
        <h1>WIP</h1>
        
        <img src="../giff/WIP.gif" alt="Work in Progress" class="wip-img">

        <p>Estic treballant en aquesta pàgina.<br>Disculpeu les molèsties.</p>
        
        <a href="../index.html" class="btn-back">← Tornar a l'inici</a>
    </div>
</body>
</html>
